<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Principal - Engenharia Subsea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        /* Estilos específicos para os cards do dashboard */
        .dashboard-card {
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .dashboard-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header bg-dark text-white text-center py-3 mb-5">
        <h1>Dashboard Principal</h1>
    </header>

    <!-- Container com os cards de navegação -->
    <main class="container">
        <div class="row justify-content-center g-4">
            <!-- Card de Requisições -->
            <div class="col-md-5">
                <a href="requisicoes.html" class="dashboard-card">
                    <div class="card text-center custom-card p-4">
                        <div class="card-body">
                            <h2 class="card-title">Requisições de Engenharia</h2>
                            <p class="card-text">Gerencie, crie e consulte as requisições de projetos.</p>
                        </div>
                    </div>
                </a>
            </div>
            <!-- Card de Engenheiros -->
            <div class="col-md-5">
                <a href="engenheiros.html" class="dashboard-card">
                    <div class="card text-center custom-card p-4">
                        <div class="card-body">
                            <h2 class="card-title">Cadastro de Engenheiros</h2>
                            <p class="card-text">Adicione e gerencie os membros da equipe na plataforma.</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
