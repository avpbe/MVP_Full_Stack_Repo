<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Equipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header bg-dark text-white text-center py-3 mb-4">
        <h1>Gerenciamento de Equipe</h1>
    </header>

    <!-- Container Principal -->
    <main class="container">
        <a href="index4.html" class="btn btn-outline-secondary mb-3">← Voltar ao Dashboard</a>

        <!-- Seção para Cadastrar Novo Engenheiro -->
        <section class="card mb-4 custom-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Cadastrar Novo Engenheiro</span>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewEngineer" aria-expanded="true" aria-controls="collapseNewEngineer">
                    Ocultar
                </button>
            </div>
            <div class="collapse show" id="collapseNewEngineer">
                <div class="card-body">
                    <form id="new-engineer-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="engineerName" placeholder="Nome Completo" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="engineerRole" placeholder="Cargo (Ex: Eng. Sênior)" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <input type="text" class="form-control" id="engineerDiscipline" placeholder="Disciplina (Ex: Estruturas)" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <select class="form-select" id="engineerPlatformRole" required>
                                <option value="" selected disabled>Selecione a atribuição...</option>
                                <option value="Admin">Admin</option>
                                <option value="Checker">Checker</option>
                                <option value="Executer">Executer</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Cadastrar Engenheiro</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Seção para Listar Engenheiros -->
        <section class="card custom-card">
            <div class="card-header">Engenheiros Cadastrados</div>
            <div id="engineers-list" class="list-group list-group-flush">
                <!-- Engenheiros serão inseridos aqui -->
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts_no_api3.js"></script>
</body>

</html>
