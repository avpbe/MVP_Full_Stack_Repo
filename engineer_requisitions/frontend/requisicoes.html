<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Requisições</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header bg-dark text-white text-center py-3 mb-4">
        <h1>Gerenciamento de Requisições</h1>
    </header>

    <!-- Container Principal -->
    <main class="container">
        <a href="index4.html" class="btn btn-outline-secondary mb-3">← Voltar ao Dashboard</a>

        <!-- Seção para Adicionar Nova Requisição -->
        <section class="card mb-4 custom-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Nova Requisição</span>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewRequest" aria-expanded="true" aria-controls="collapseNewRequest">
                    Ocultar
                </button>
            </div>
            <div class="collapse show" id="collapseNewRequest">
                <div class="card-body">
                    <form id="new-request-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="projectName" placeholder="Nome do Projeto" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="discipline" placeholder="Disciplina" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="description" rows="2" placeholder="Descrição"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Adicionar Requisição</button>
                    </form>
                </div>
            </div>
        </section>
  
        <!-- Seção para Listar Requisições -->
        <section class="card custom-card">
            <div class="card-header">Requisições Cadastradas</div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome do projeto...">
                    <button class="btn btn-secondary" type="button" onclick="searchRequest()">Buscar</button>
                </div>
                <div id="requests-list" class="row">
                    <!-- Cards de requisição serão inseridos aqui -->
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts_no_api3.js"></script>
</body>

</html>
