<!DOCTYPE html>
<html lang="pt-BR">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Engenharia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
  
<body>
    <!-- Cabeçalho -->
    <header class="header bg-dark text-white text-center py-3 mb-4">
        <h1>Dashboard de Engenharia Subsea</h1>
    </header>
  
    <!-- Container Principal Fluido -->
    <main class="container-fluid px-4">
        <div class="row">

            <!-- Coluna da Esquerda: Gerenciamento de Requisições -->
            <div class="col-lg-7">
                <h3 class="mb-3">Projetos e Requisições</h3>

                <!-- Seção para Adicionar Nova Requisição -->
                <section class="card mb-4 custom-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Nova Requisição</span>
                        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewRequest" aria-expanded="true" aria-controls="collapseNewRequest">
                            Ocultar
                        </button>
                    </div>
                    <div class="collapse show" id="collapseNewRequest">
                        <div class="card-body">
                            <form id="new-request-form">
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="projectName" placeholder="Nome do Projeto" required>
                                </div>
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="discipline" placeholder="Disciplina" required>
                                </div>
                                <div class="mb-3">
                                    <textarea class="form-control" id="description" rows="2" placeholder="Descrição"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Adicionar Requisição</button>
                            </form>
                        </div>
                    </div>
                </section>
          
                <!-- Seção para Listar Requisições -->
                <section class="card custom-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Requisições Cadastradas</span>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome do projeto...">
                            <button class="btn btn-secondary" type="button" onclick="searchRequest()">Buscar</button>
                        </div>
                        <div id="requests-list" class="row">
                            <!-- Cards de requisição serão inseridos aqui -->
                        </div>
                    </div>
                </section>
            </div>

            <!-- Coluna da Direita: Gerenciamento de Engenheiros -->
            <div class="col-lg-5 mt-4 mt-lg-0">
                <h3 class="mb-3">Equipe</h3>

                <!-- Seção para Cadastrar Novo Engenheiro -->
                <section class="card mb-4 custom-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Cadastrar Novo Engenheiro</span>
                        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewEngineer" aria-expanded="true" aria-controls="collapseNewEngineer">
                            Ocultar
                        </button>
                    </div>
                    <div class="collapse show" id="collapseNewEngineer">
                        <div class="card-body">
                            <form id="new-engineer-form">
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="engineerName" placeholder="Nome Completo" required>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <input type="text" class="form-control" id="engineerRole" placeholder="Cargo (Ex: Eng. Sênior)" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <input type="text" class="form-control" id="engineerDiscipline" placeholder="Disciplina (Ex: Estruturas)" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <select class="form-select" id="engineerPlatformRole" required>
                                        <option value="" selected disabled>Selecione a atribuição...</option>
                                        <option value="Admin">Admin</option>
                                        <option value="Checker">Checker</option>
                                        <option value="Executer">Executer</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Cadastrar Engenheiro</button>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- Seção para Listar Engenheiros -->
                <section class="card custom-card">
                    <div class="card-header">Engenheiros Cadastrados</div>
                    <div id="engineers-list" class="list-group list-group-flush">
                        <!-- Engenheiros serão inseridos aqui -->
                    </div>
                </section>
            </div>
        </div>
    </main>
  
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts_no_api2.js"></script>
</body>
  
</html>
