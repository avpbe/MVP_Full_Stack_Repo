<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Engenharia (SPA)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        .dashboard-card {
            cursor: pointer;
        }
        .view {
            display: none; /* Todas as views começam ocultas */
        }
    </style>
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header bg-dark text-white text-center py-3 mb-4">
        <h1 id="header-title">Dashboard Principal</h1>
    </header>

    <main class="container">

        <!-- 1. TELA DO DASHBOARD (INICIAL) -->
        <div id="dashboard-view" class="view">
            <div class="row justify-content-center g-4">
                <!-- Card de Requisições -->
                <div class="col-md-5">
                    <div class="card text-center custom-card p-4 dashboard-card" onclick="showView('requests-view', 'Gerenciamento de Requisições')">
                        <div class="card-body">
                            <h2 class="card-title">Requisições de Engenharia</h2>
                            <p class="card-text">Gerencie, crie e consulte as requisições de projetos.</p>
                        </div>
                    </div>
                </div>
                <!-- Card de Engenheiros -->
                <div class="col-md-5">
                    <div class="card text-center custom-card p-4 dashboard-card" onclick="showView('engineers-view', 'Gerenciamento de Equipe')">
                        <div class="card-body">
                            <h2 class="card-title">Cadastro de Engenheiros</h2>
                            <p class="card-text">Adicione e gerencie os membros da equipe na plataforma.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. TELA DE REQUISIÇÕES -->
        <div id="requests-view" class="view">
            <button class="btn btn-outline-secondary mb-3" onclick="showView('dashboard-view', 'Dashboard Principal')">← Voltar ao Dashboard</button>

            <!-- Seção para Adicionar Nova Requisição -->
            <section class="card mb-4 custom-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Nova Requisição</span>
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewRequest">Ocultar</button>
                </div>
                <div class="collapse show" id="collapseNewRequest">
                    <div class="card-body">
                        <form id="new-request-form">
                            <input type="text" class="form-control mb-3" id="projectName" placeholder="Nome do Projeto" required>
                            <input type="text" class="form-control mb-3" id="discipline" placeholder="Disciplina" required>
                            <textarea class="form-control mb-3" id="description" rows="2" placeholder="Descrição"></textarea>
                            <button type="submit" class="btn btn-primary w-100">Adicionar Requisição</button>
                        </form>
                    </div>
                </div>
            </section>
      
            <!-- Seção para Listar Requisições -->
            <section class="card custom-card">
                <div class="card-header">Requisições Cadastradas</div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nome do projeto...">
                        <button class="btn btn-secondary" type="button" onclick="searchRequest()">Buscar</button>
                    </div>
                    <div id="requests-list" class="row"></div>
                </div>
            </section>
        </div>

        <!-- 3. TELA DE ENGENHEIROS -->
        <div id="engineers-view" class="view">
            <button class="btn btn-outline-secondary mb-3" onclick="showView('dashboard-view', 'Dashboard Principal')">← Voltar ao Dashboard</button>

            <!-- Seção para Cadastrar Novo Engenheiro -->
            <section class="card mb-4 custom-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Cadastrar Novo Engenheiro</span>
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNewEngineer">Ocultar</button>
                </div>
                <div class="collapse show" id="collapseNewEngineer">
                    <div class="card-body">
                        <form id="new-engineer-form">
                            <input type="text" class="form-control mb-3" id="engineerName" placeholder="Nome Completo" required>
                            <div class="row">
                                <div class="col-md-6 mb-3"><input type="text" class="form-control" id="engineerRole" placeholder="Cargo" required></div>
                                <div class="col-md-6 mb-3"><input type="text" class="form-control" id="engineerDiscipline" placeholder="Disciplina" required></div>
                            </div>
                            <select class="form-select mb-3" id="engineerPlatformRole" required>
                                <option value="" selected disabled>Selecione a atribuição...</option>
                                <option value="Admin">Admin</option>
                                <option value="Checker">Checker</option>
                                <option value="Executer">Executer</option>
                            </select>
                            <button type="submit" class="btn btn-success w-100">Cadastrar Engenheiro</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Seção para Listar Engenheiros -->
            <section class="card custom-card">
                <div class="card-header">Engenheiros Cadastrados</div>
                <div id="engineers-list" class="list-group list-group-flush"></div>
            </section>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts_no_api4.js"></script>
</body>

</html>
